[package]
name = "clicker_game"
version = "0.1.0"
edition = "2024"

[dependencies]
app_dirs2 = "2.5.5"
avian3d = "0.6.1"
bevy = { version = "0.18.1", features = ["jpeg", "custom_cursor", "exr"] }
bevy_animation = "0.18.1"
bevy_asset = "0.18.1"
bevy_ecs = "0.18.1"
bevy_flair = "0.7.0"
bevy_hanabi = "0.18.0"
bevy_kira_audio = { version = "0.25.0", features = ["ogg"] }
bevy_symbios_ground = { version = "0.3.0", features = ["physics"] }
bevy_symbios_texture = "0.6.0"
include_dir = "0.7.4"
log = { version = "0.4.32", features = ["max_level_debug", "release_max_level_warn"] }
noise = "0.9.0"
rand = "0.10.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
